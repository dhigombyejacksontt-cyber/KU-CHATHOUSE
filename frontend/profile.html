<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU Chat House - Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style.css links -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-page" data-page="profile">
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="brand">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>KU Chat House</span>
            </div>

            <div class="nav-search" id="nav-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="global-search-input" placeholder="Search members or posts..."
                       oninput="handleGlobalSearchInput(event)"
                       onfocus="handleGlobalSearchFocus()">
                <button type="button" class="clear-search-btn" id="clear-search-btn" style="display:none;" onclick="clearGlobalSearch()" title="Clear search">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="search-results-dropdown" id="search-results-dropdown"></div>
            </div>

            <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"><i class="fa-solid fa-moon"></i></button>

            <div class="nav-profile-menu">
                <div class="user-mini-profile clickable" onclick="window.location.href='/profile'" title="My Profile">
                    <div class="user-avatar" id="nav-avatar">U</div>
                    <div class="user-meta-info">
                        <span class="user-name" id="nav-username">Loading...</span>
                        <span class="user-role-badge" id="nav-role">Student</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="handleLogout()" title="Sign Out">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Log Out</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Layout -->
    <div class="app-layout">
        <aside class="sidebar">
            <nav class="sidebar-menu">
                <a href="/feed" class="sidebar-menu-item" data-page="feed">
                    <i class="fa-solid fa-house"></i> Feed
                </a>
                <a href="/members" class="sidebar-menu-item" data-page="members">
                    <i class="fa-solid fa-users"></i> Members
                </a>
                <a href="/messages" class="sidebar-menu-item" data-page="messages">
                    <i class="fa-solid fa-comment-dots"></i> Messages
                    <span class="badge-count" id="requests-badge" style="display:none;">0</span>
                </a>
                <a href="/about" class="sidebar-menu-item" data-page="about">
                    <i class="fa-solid fa-circle-info"></i> About
                </a>
            </nav>

            <div class="profile-card">
                <div class="profile-header-glow"></div>
                <div class="profile-details">
                    <div class="profile-avatar-large clickable" id="sidebar-avatar" onclick="window.location.href='/profile'" title="My Profile">?</div>
                    <h3 id="sidebar-username">Username</h3>
                    <p class="profile-role" id="sidebar-role">Category</p>
                    <p class="profile-bio" id="sidebar-bio">...</p>

                    <hr class="sidebar-divider">

                    <div class="profile-meta-list">
                        <div class="meta-item">
                            <span class="meta-label">ID:</span>
                            <span class="meta-val" id="sidebar-id">...</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Faculty:</span>
                            <span class="meta-val" id="sidebar-faculty">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Profile Area -->
        <main class="feed-content">

            <!-- ===================== OWN PROFILE (editable) ===================== -->
            <section class="profile-page-card" id="own-profile-section" style="display:none;">
                <div class="modal-header profile-page-header">
                    <i class="fa-solid fa-user-pen modal-icon text-indigo"></i>
                    <h2>My Profile</h2>
                    <p>Update your display photo, username and bio. Your University ID can never be changed.</p>
                </div>

                <form id="profile-form" onsubmit="handleSaveProfilePage(event)">
                    <div class="profile-photo-edit">
                        <div class="profile-photo-edit-frame">
                            <img id="profile-photo-preview" src="" alt="Profile Photo" style="display:none;">
                            <div id="profile-photo-placeholder" class="profile-avatar-large">?</div>
                        </div>
                        <input type="file" id="profile-photo-input" accept="image/*" style="display:none;" onchange="handleAvatarFileSelected(event)">
                        <label for="profile-photo-input" class="upload-photo-btn">
                            <i class="fa-solid fa-camera"></i> Change Photo
                        </label>
                    </div>

                    <div class="input-group">
                        <label for="profile-username-input"><i class="fa-solid fa-user"></i> Username</label>
                        <input type="text" id="profile-username-input" placeholder="Your display name" required minlength="3">
                    </div>

                    <div class="input-group">
                        <label for="profile-bio-input">
                            <i class="fa-solid fa-pen-nib"></i> Bio
                            <span class="char-counter" id="profile-bio-count">0/280</span>
                        </label>
                        <textarea id="profile-bio-input" class="profile-bio-textarea" maxlength="280"
                                  placeholder="Tell people a bit about yourself -- your interests, what you study, anything you'd like others to know."
                                  oninput="handleBioInput(event)"></textarea>
                    </div>

                    <div class="input-group">
                        <label><i class="fa-solid fa-id-card"></i> University ID <span class="locked-tag"><i class="fa-solid fa-lock"></i> Locked</span></label>
                        <input type="text" id="profile-id-display" disabled>
                    </div>

                    <div class="modal-actions profile-page-actions">
                        <button type="submit" class="submit-btn bg-indigo">Save Changes <i class="fa-solid fa-floppy-disk"></i></button>
                    </div>
                </form>
            </section>

            <!-- ================ ANOTHER MEMBER'S PROFILE (read-only) ================ -->
            <section class="profile-page-card" id="member-profile-section" style="display:none;">
                <a href="/members" class="back-to-members-link"><i class="fa-solid fa-arrow-left"></i> Back to Members</a>

                <div class="member-profile-hero" id="member-profile-hero">
                    <!-- Filled dynamically by loadMemberProfile() -->
                </div>
            </section>

            <!-- Loading state -->
            <div class="feed-loading" id="profile-page-loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Loading profile...</p>
            </div>

            <!-- Not-found state -->
            <div class="empty-state-mini" id="profile-page-not-found" style="display:none;">
                <i class="fa-solid fa-user-slash"></i>
                <p>That member could not be found.</p>
            </div>
        </main>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script Import -->
    <script src="app.js"></script>
</body>
</html>
