<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU Chat House - Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style.css links -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-page" data-page="profile">
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-container">

            <!-- Left: Brand -->
            <a class="brand" href="/feed">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>KU Chat House</span>
            </a>

            <!-- Centre: Nav links -->
            <div class="nav-links">
                <a href="/feed" class="nav-link" data-page="feed" title="Feed">
                    <i class="fa-solid fa-house"></i>
                    <span>Feed</span>
                </a>
                <a href="/members" class="nav-link" data-page="members" title="Members">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
                <a href="/messages" class="nav-link" data-page="messages" title="Messages">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Messages</span>
                    <span class="nav-badge" id="requests-badge" style="display:none;">0</span>
                </a>
                <a href="/profile" class="nav-link active" data-page="profile" title="Profile">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="/about" class="nav-link" data-page="about" title="About">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>About</span>
                </a>
            </div>

            <!-- Right: Search + Theme + Avatar -->
            <div class="nav-right">
                <div class="nav-search" id="nav-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search-input" placeholder="Search..."
                           oninput="handleGlobalSearchInput(event)"
                           onfocus="handleGlobalSearchFocus()">
                    <button type="button" class="clear-search-btn" id="clear-search-btn" style="display:none;" onclick="clearGlobalSearch()" title="Clear">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="search-results-dropdown" id="search-results-dropdown"></div>
                </div>

                <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"><i class="fa-solid fa-moon"></i></button>

                <!-- Avatar + dropdown -->
                <div class="nav-avatar-wrap" id="nav-avatar-wrap">
                    <button class="nav-avatar-btn" id="nav-avatar-btn" onclick="toggleNavDropdown()" aria-label="Account menu">
                        <div class="user-avatar" id="nav-avatar">U</div>
                        <i class="fa-solid fa-caret-down nav-caret"></i>
                    </button>
                    <div class="nav-dropdown" id="nav-dropdown">
                        <div class="nav-dropdown-profile">
                            <div class="nav-drop-avatar" id="nav-drop-avatar">U</div>
                            <div class="nav-drop-info">
                                <span class="nav-drop-name" id="nav-username">Loading...</span>
                                <span class="user-role-badge" id="nav-role">Student</span>
                                <span class="nav-drop-id" id="nav-drop-id"></span>
                            </div>
                        </div>
                        <div class="nav-dropdown-divider"></div>
                        <a href="/profile" class="nav-dropdown-item">
                            <i class="fa-solid fa-user-pen"></i> Edit Profile
                        </a>
                        <button class="nav-dropdown-item nav-dropdown-logout" onclick="handleLogout()">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </nav>

    <!-- Main Content Layout -->
    <div class="app-layout">

        <!-- Main Profile Area -->
        <main class="feed-content page-centered">

            <!-- ===================== OWN PROFILE ===================== -->
            <section id="own-profile-section" style="display:none;">

                <!-- ── Profile hero card ── -->
                <div class="profile-hero-card">

                    <!-- Cover strip -->
                    <div class="profile-cover"></div>

                    <!-- Avatar with camera overlay -->
                    <div class="profile-hero-body">
                        <div class="profile-avatar-wrap">
                            <div class="profile-avatar-ring" id="profile-avatar-ring">
                                <img id="profile-photo-preview" src="" alt="Profile Photo" style="display:none;">
                                <span id="profile-photo-placeholder">?</span>
                            </div>
                            <input type="file" id="profile-photo-input" accept="image/*" style="display:none;" onchange="handleAvatarFileSelected(event)">
                            <label for="profile-photo-input" class="profile-camera-btn" title="Change profile photo">
                                <i class="fa-solid fa-camera"></i>
                            </label>
                        </div>

                        <!-- Name + category badge -->
                        <div class="profile-hero-info">
                            <h2 class="profile-hero-name" id="profile-display-name">—</h2>
                            <span class="user-role-badge" id="profile-display-role">Student</span>
                        </div>

                        <!-- Stats row -->
                        <div class="profile-stats-row">
                            <div class="profile-stat">
                                <span class="profile-stat-val" id="profile-connections-count">—</span>
                                <span class="profile-stat-label">Connections</span>
                            </div>
                            <div class="profile-stat-divider"></div>
                            <div class="profile-stat">
                                <span class="profile-stat-val" id="profile-display-faculty">—</span>
                                <span class="profile-stat-label">Faculty</span>
                            </div>
                        </div>

                        <!-- Locked ID + category chips -->
                        <div class="profile-locked-row">
                            <span class="profile-locked-chip">
                                <i class="fa-solid fa-id-card"></i>
                                <span id="profile-display-id">—</span>
                                <i class="fa-solid fa-lock profile-lock-icon" title="Cannot be changed"></i>
                            </span>
                            <span class="profile-locked-chip">
                                <i class="fa-solid fa-building-columns"></i>
                                <span id="profile-display-category">—</span>
                                <i class="fa-solid fa-lock profile-lock-icon" title="Cannot be changed"></i>
                            </span>
                        </div>

                        <!-- Bio display -->
                        <p class="profile-bio-display" id="profile-bio-display"></p>
                    </div>
                </div>

                <!-- ── Edit form card ── -->
                <div class="profile-edit-card">
                    <h3 class="profile-edit-heading">
                        <i class="fa-solid fa-user-pen text-indigo"></i> Edit Profile
                    </h3>

                    <form id="profile-form" onsubmit="handleSaveProfilePage(event)">
                        <div class="input-group">
                            <label for="profile-username-input"><i class="fa-solid fa-user"></i> Display Name</label>
                            <input type="text" id="profile-username-input" placeholder="Your display name" required minlength="3">
                        </div>

                        <div class="input-group">
                            <label for="profile-bio-input">
                                <i class="fa-solid fa-pen-nib"></i> Bio
                                <span class="char-counter" id="profile-bio-count">0/280</span>
                            </label>
                            <textarea id="profile-bio-input" class="profile-bio-textarea" maxlength="280"
                                      placeholder="Tell people about yourself — your interests, what you study..."
                                      oninput="handleBioInput(event)"></textarea>
                        </div>

                        <div class="modal-actions profile-page-actions">
                            <button type="submit" class="submit-btn bg-indigo">
                                Save Changes <i class="fa-solid fa-floppy-disk"></i>
                            </button>
                        </div>
                    </form>
                </div>

            </section>

            <!-- ================ ANOTHER MEMBER'S PROFILE (read-only) ================ -->
            <section class="profile-page-card" id="member-profile-section" style="display:none;">
                <a href="/members" class="back-to-members-link"><i class="fa-solid fa-arrow-left"></i> Back to Members</a>

                <div class="member-profile-hero" id="member-profile-hero">
                    <!-- Filled dynamically by loadMemberProfile() -->
                </div>
            </section>

            <!-- Loading state -->
            <div class="feed-loading" id="profile-page-loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Loading profile...</p>
            </div>

            <!-- Not-found state -->
            <div class="empty-state-mini" id="profile-page-not-found" style="display:none;">
                <i class="fa-solid fa-user-slash"></i>
                <p>That member could not be found.</p>
            </div>
        </main>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script Import -->
    <script src="app.js"></script>
</body>
</html>
