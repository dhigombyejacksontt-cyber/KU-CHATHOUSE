<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU Chat House - Campus Feed</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Style.css links -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="feed-page" data-page="feed">
    <!-- Navigation Bar -->
    <nav class="main-nav">
        <div class="nav-container">

            <!-- Left: Brand -->
            <a class="brand" href="/feed">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>KU Chat House</span>
            </a>

            <!-- Centre: Nav links -->
            <div class="nav-links">
                <a href="/feed" class="nav-link active" data-page="feed" title="Feed">
                    <i class="fa-solid fa-house"></i>
                    <span>Feed</span>
                </a>
                <a href="/members" class="nav-link" data-page="members" title="Members">
                    <i class="fa-solid fa-users"></i>
                    <span>Members</span>
                </a>
                <a href="/messages" class="nav-link" data-page="messages" title="Messages">
                    <i class="fa-solid fa-comment-dots"></i>
                    <span>Messages</span>
                    <span class="nav-badge" id="requests-badge" style="display:none;">0</span>
                </a>
                <a href="/profile" class="nav-link" data-page="profile" title="Profile">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="/about" class="nav-link" data-page="about" title="About">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>About</span>
                </a>
            </div>

            <!-- Right: Search + Theme + Avatar -->
            <div class="nav-right">
                <div class="nav-search" id="nav-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search-input" placeholder="Search..."
                           oninput="handleGlobalSearchInput(event)"
                           onfocus="handleGlobalSearchFocus()">
                    <button type="button" class="clear-search-btn" id="clear-search-btn" style="display:none;" onclick="clearGlobalSearch()" title="Clear">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="search-results-dropdown" id="search-results-dropdown"></div>
                </div>

                <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"><i class="fa-solid fa-moon"></i></button>

                <!-- Avatar + dropdown -->
                <div class="nav-avatar-wrap" id="nav-avatar-wrap">
                    <button class="nav-avatar-btn" id="nav-avatar-btn" onclick="toggleNavDropdown()" aria-label="Account menu">
                        <div class="user-avatar" id="nav-avatar">U</div>
                        <i class="fa-solid fa-caret-down nav-caret"></i>
                    </button>
                    <div class="nav-dropdown" id="nav-dropdown">
                        <div class="nav-dropdown-profile">
                            <div class="nav-drop-avatar" id="nav-drop-avatar">U</div>
                            <div class="nav-drop-info">
                                <span class="nav-drop-name" id="nav-username">Loading...</span>
                                <span class="user-role-badge" id="nav-role">Student</span>
                                <span class="nav-drop-id" id="nav-drop-id"></span>
                            </div>
                        </div>
                        <div class="nav-dropdown-divider"></div>
                        <a href="/profile" class="nav-dropdown-item">
                            <i class="fa-solid fa-user-pen"></i> Edit Profile
                        </a>
                        <button class="nav-dropdown-item nav-dropdown-logout" onclick="handleLogout()">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </nav>

    <!-- Main Content Layout -->
    <div class="app-layout">

        <!-- Main Feed Area -->
        <main class="feed-content page-centered">
            <!-- Create Post Box -->
            <section class="create-post-card">
                <div class="create-post-header">
                    <div class="mini-avatar" id="create-post-avatar">U</div>
                    <h3>Share or Ask Something...</h3>
                </div>
                
                <form id="create-post-form" onsubmit="handleCreatePost(event)">
                    <div class="textarea-wrapper">
                        <textarea id="post-content" placeholder="What is on your mind? Ask a question or spark a discussion..."></textarea>
                    </div>

                    <!-- Attached Photo/Audio Preview -->
                    <div class="post-media-preview" id="post-media-preview" style="display: none;"></div>

                    <div class="create-post-actions">
                        <div class="create-post-actions-left">
                            <input type="file" id="post-media-input" accept="image/*,audio/*" style="display: none;" onchange="handlePostMediaSelected(event)">
                            <label for="post-media-input" class="attach-media-btn" title="Attach a photo or audio clip">
                                <i class="fa-solid fa-paperclip"></i> Photo / Audio
                            </label>

                            <!-- Admin-only option -->
                            <div class="admin-announcement-toggle" id="admin-announcement-toggle" style="display: none;">
                                <label class="switch-container">
                                    <input type="checkbox" id="post-as-announcement" onchange="togglePostTypePlaceholder()">
                                    <span class="switch-slider"></span>
                                </label>
                                <span class="toggle-label"><i class="fa-solid fa-bullhorn text-amber"></i> Post as Announcement (Pinned)</span>
                            </div>
                        </div>

                        <button type="submit" class="post-submit-btn">
                            <span>Post</span> <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Annoucement Event Ribbon (Desktop view helper) -->
            <div class="announcements-section-header" id="announcements-title-section" style="display: none;">
                <i class="fa-solid fa-bullhorn text-amber"></i>
                <h2>Pinned University Announcements</h2>
            </div>
            
            <!-- Pinned Announcements Feed -->
            <div class="announcements-container" id="announcements-feed"></div>

            <!-- Feed Header -->
            <div class="feed-header-title">
                <h2>Discussion Feed</h2>
                <button class="refresh-feed-btn" onclick="loadPosts()" title="Refresh Feed">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- Posts List Feed -->
            <div class="posts-container" id="posts-feed">
                <!-- Posts will be rendered here dynamically -->
                <div class="feed-loading">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <p>Loading campus discussions...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Post Modal -->
    <div class="modal-overlay" id="edit-post-modal">
        <div class="modal-card scale-in">
            <div class="modal-header">
                <i class="fa-solid fa-pen-to-square modal-icon text-indigo"></i>
                <h2>Edit Post</h2>
                <p>Modify the content of your post below.</p>
            </div>
            
            <form id="edit-post-form" onsubmit="handleSaveEdit(event)">
                <input type="hidden" id="edit-post-id" value="">
                <div class="textarea-wrapper">
                    <textarea id="edit-post-content" placeholder="Edit your post content..." required></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="submit-btn bg-indigo">Save Changes <i class="fa-solid fa-floppy-disk"></i></button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Script Import -->
    <script src="app.js"></script>
</body>
</html>
